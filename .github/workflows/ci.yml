name: CI Monorepo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build e Testes dos Servicos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build API Java
        run: |
          cd api
          mvn clean test-compile

      - name: Configurar Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build Servico Go
        run: |
          cd services
          go build ./...
